<li class='list-item'><span class='rank' data-raw='{{stat rank}}'>#{{stat rank}}</span><span class='name' data-raw='{{player name}}'><a class='profile_link' href='../player/{{player name}}.html'><img class='inline_face' src='../faces/{{player name}}.png'>{{player name}}</a></span><span class='number' data-raw='{{raw}}'><span class='raw-number'>{{raw}}</span><span class='united-number'>{{amount conv}}</span></span><span class='percentage' data-raw='{{percentage}}'>{{percentage rounded}}%</span><div class='progress-bar'</div><div class='progress-bar-fill' style='width: {{percentage}}%;'</div></li>
